{% extends "base.html" %}
{% block content %}
<h1>Ajouter un événement</h1>
<form method="post" class="card">
    <label>Titre *</label>
    <input name="title" value="{{ form.get('title', '') }}" required>
    <label>Lieu *</label>
    <input name="location" value="{{ form.get('location', '') }}" required>
    <label>Date *</label>
    <input name="event_date" type="date" value="{{ form.get('event_date', '')
}}" required>
    <label>Capacité *</label>
    <input name="capacity" type="number" min="1" value="{{ form.get('capacity',
'') }}" required>
    <label>Prix (DH)</label>
    <input name="price" type="number" min="0" step="0.01" value="{{
form.get('price', '0') }}">
    <button type="submit">Enregistrer</button>
</form>
{% endblock %}
